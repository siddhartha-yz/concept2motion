name: mechanism-contracts
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/bench.py check
      - run: python tools/bench.py prepare softmax --out /tmp/softmax-brief
      - run: python -m py_compile tools/bench.py tools/evaluate_paper2manim.py
