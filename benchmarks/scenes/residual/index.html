<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Identity survives · Concept2Motion</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070d18;color:#b6c4dc;font:14px system-ui;display:grid;place-items:center;min-height:100vh}
canvas{max-width:100vw;max-height:calc(100vh - 58px);width:auto;height:auto;aspect-ratio:16/9}
nav{position:fixed;bottom:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:16px;padding:8px 24px;background:#0b1423}
button{color:#dce9ff;background:#17253c;border:1px solid #2b405e;padding:6px 16px;border-radius:5px;cursor:pointer}input{flex:1;accent-color:#64dcca}output{width:90px;font-variant-numeric:tabular-nums}
</style></head><body>
<canvas id="scene" width="1920" height="1080" aria-label="The identity branch preserves a signed vector while a correction branch joins it head to tail; each output component is their sum"></canvas>
<nav><button id="play">Pause</button><input id="seek" type="range" min="0" max="12" step="0.01" value="0" aria-label="Animation time"><output id="time">0.00 / 12</output></nav>
<script src="scene.js"></script>
</body></html>
